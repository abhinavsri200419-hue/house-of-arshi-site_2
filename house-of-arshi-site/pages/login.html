<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F8F4EC">
<title>Log In | House of Arshi</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preload" href="../assets/fonts/playfair-display-v40-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/outfit-v15-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/style.css">
<style>
  body.auth-body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
    padding: 24px 16px;
    background:
      radial-gradient(ellipse 80% 60% at 20% 15%, rgba(216, 184, 131, 0.35), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 90%, rgba(232, 196, 192, 0.45), transparent 65%),
      linear-gradient(160deg, #FBF7EE 0%, #F4ECDB 45%, #EFE2C8 100%);
  }
  /* Decorative motif: faint gold ring behind the card */
  body.auth-body::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(720px, 100vw);
    height: min(720px, 100vw);
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(182, 138, 78, 0.12) 0%, rgba(182, 138, 78, 0.04) 40%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  /* Subtle pattern overlay using a soft diagonal weave */
  body.auth-body::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(182, 138, 78, 0.04) 0 1px, transparent 1px 18px),
      repeating-linear-gradient(-45deg, rgba(122, 46, 46, 0.03) 0 1px, transparent 1px 22px);
    pointer-events: none;
    z-index: 0;
  }
  .auth-card {
    /* auto margins centre the card, but let it scroll when the keyboard is open */
    margin: auto;
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(182, 138, 78, 0.18);
    border-radius: 16px;
    padding: 44px 36px 36px;
    box-shadow:
      0 30px 80px rgba(22, 19, 16, 0.12),
      0 4px 12px rgba(182, 138, 78, 0.08);
  }
  .auth-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
    text-align: center;
  }
  .auth-logo img {
    display: block;
    height: 54px;
    width: auto;
    margin: 0 auto 12px;
  }
  .auth-logo .logo-wordmark {
    display: block;
    width: 100%;
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: var(--black);
    line-height: 1.2;
    text-align: center;
  }
  .auth-logo .logo-tagline {
    display: block;
    width: 100%;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-text);
    margin-top: 6px;
    text-align: center;
  }
  .auth-title { font-family: var(--font-display); font-size: 26px; margin: 0 0 6px; text-align: center; color: var(--black); }
  .auth-subtitle { text-align: center; font-size: 14px; color: #6b6560; margin: 0 0 28px; }
  .auth-field { margin-bottom: 18px; }
  .auth-field label { display: block; font-size: 13px; font-weight: 500; color: var(--black-soft); margin-bottom: 6px; }
  .auth-field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 16px;
    background: var(--ivory);
  }
  .auth-field input:focus { outline: none; border-color: var(--gold); }
  .auth-submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--black);
    color: #fff;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .auth-submit:hover:not(:disabled) { background: var(--maroon-deep); }
  .auth-error {
    background: #FCEBEA;
    color: var(--maroon-deep);
    border: 1px solid var(--blush-deep);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 18px;
    display: none;
  }
  .auth-back {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin: -24px 0 4px -6px;
    padding: 0 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
  }
  .auth-back:hover { color: var(--black); }
  .auth-switch { text-align: center; margin-top: 22px; font-size: 14px; color: #6b6560; }
  .auth-switch a { color: var(--gold-text); font-weight: 600; text-decoration: none; padding: 13px 4px; margin: 0 -4px; }
  .auth-switch a:hover { text-decoration: underline; }
</style>
</head>
<body class="auth-body">

<main class="auth-card">
  <a href="../index.html" class="auth-back">← Back to shop</a>
  <div class="auth-logo">
    <img src="../assets/mark-black.png" alt="House of Arshi mark">
    <span class="logo-wordmark">House of Arshi</span>
    <span class="logo-tagline">TIMELESS ELEGANCE, CRAFTED FOR YOU</span>
  </div>

  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-subtitle">Log in to shop, save favourites, and track orders.</p>

  <div class="auth-error" id="loginError"></div>

  <form id="loginForm" novalidate>
    <div class="auth-field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="email" required>
    </div>
    <div class="auth-field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <button type="submit" class="auth-submit" id="loginSubmitBtn">Log In</button>
  </form>

  <p class="auth-switch">New to House of Arshi? <a href="signup.html">Create an account</a></p>
</main>

<script src="../assets/api-client.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const submitBtn = document.getElementById('loginSubmitBtn');

  // Already logged in? Skip straight to the homepage.
  if (getToken()) {
    window.location.replace('../index.html');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    try {
      await AuthAPI.login(email, password);
      submitBtn.textContent = 'Logging in...';
      await completeLoginRedirect('../index.html');
    } catch (err) {
      errorBox.textContent = err.message || 'Login failed. Please try again.';
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
